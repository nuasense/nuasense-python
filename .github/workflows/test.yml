name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Official Python images instead of setup-python: the runners no longer
    # carry 3.9, which Raspberry Pi OS Bullseye still ships.
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
